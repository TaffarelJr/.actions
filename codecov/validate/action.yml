# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

# Checks a Codecov configuration file against Codecov's own validator.
#
# Codecov silently falls back to its defaults when the file does not parse,
# so a typo fails nothing - it just quietly stops enforcing the thresholds.
# This turns that into a failed check instead.
#
# The caller must have checked the repo out;
# only the file itself is read, so fetch-depth: 1 is enough.

name: Validate Codecov
description: Validates a codecov.yml against Codecov's own validator.

inputs:
  config-path:
    description: Path to the Codecov configuration file.
    required: false
    default: .github/codecov.yml
  endpoint:
    description: Codecov's validation endpoint.
    required: false
    default: https://codecov.io/validate

outputs:
  valid:
    description: Whether the validator accepted the file.
    value: ${{ steps.validate.outputs.valid }}

runs:
  using: composite
  steps:
    - name: Validate the Codecov configuration
      id: validate
      shell: pwsh
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
        ENDPOINT: ${{ inputs.endpoint }}
      run: >
        & '${{ github.action_path }}/Test-CodecovConfig.ps1'
        -ConfigPath $env:CONFIG_PATH
        -Endpoint $env:ENDPOINT
