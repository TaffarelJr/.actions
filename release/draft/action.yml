# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

# Drafts the GitHub Release. Every repo calls this one copy.
#
# Nothing is built here.
# The binaries were built, versioned, and uploaded by a CI run -
# for this exact commit, or for the version named in 'version';
# this action finds that run, takes its artifacts, and attaches them.
# So what gets released is bit-for-bit what was tested,
# and a release cannot differ from the build that verified it.
#
# The release is created as a DRAFT on purpose.
# No tag exists yet, nothing is published, and nothing downstream fires
# until a human opens it, reads the notes, and presses Publish.
# Deleting a draft leaves no trace,
# so a release that turns out to be wrong costs nothing.
#
# The caller must have checked out with fetch-depth: 0 -
# the changelog needs all the history and tags.
# The caller should also grant copilot-requests: write
# and pass GH_TOKEN: ${{ github.token }} at its own workflow level -
# an env var set on this action's own steps
# does not reliably reach ai-inference, a nested composite action call,
# so it has to come from higher up.
# Without it the AI summary has no way to authenticate
# and the notes keep their placeholder - never fatal, just quietly less useful.

name: Draft Release
description: Drafts a GitHub Release from the CI artifacts built for this commit.

inputs:
  build-workflow:
    description: Name of the workflow whose artifacts should be released.
    required: false
    default: Continuous Integration
  artifact-name:
    description: Artifact holding the built output and version.txt.
    required: false
    default: packages
  version:
    description: >-
      Release this earlier build instead of this commit's,
      e.g. 1.4.2 or v1.4.2.
      There is no fallback: if no CI run still holds that version's artifact,
      the draft is refused.
    required: false
    default: ''

outputs:
  version:
    description: The version that was drafted.
    value: ${{ steps.resolve.outputs.version }}
  url:
    description: The draft release's URL.
    value: ${{ steps.create.outputs.url }}

runs:
  using: composite
  steps:
    #─────────────────────────────────────────────────────────────────────────
    # Find the build to release
    #─────────────────────────────────────────────────────────────────────────

    - name: Take the artifacts CI already built
      id: artifacts
      uses: TaffarelJr/.actions/release/fetch-artifacts@v1
      with:
        build-workflow: ${{ inputs.build-workflow }}
        artifact-name: ${{ inputs.artifact-name }}
        version: ${{ inputs.version }}

    #─────────────────────────────────────────────────────────────────────────
    # Decide the version
    #─────────────────────────────────────────────────────────────────────────

    - name: Calculate a fallback version
      id: fallback
      if: steps.artifacts.outputs.version == '' && inputs.version == ''
      uses: TaffarelJr/.actions/version/calculate@v1
      with:
        write-to-job-summary: 'false' # Only a fallback; do not announce it as the version

    # The caller's checkout with fetch-depth: 0
    # already fetches every tag (its default refspec includes refs/tags/*),
    # which is what lets Resolve-DraftVersion check an existing tag
    # with no fetch-tags input needed.
    - name: Resolve the version
      id: resolve
      shell: pwsh
      env:
        REQUESTED: ${{ inputs.version }}
        FOUND: ${{ steps.artifacts.outputs.found }}
        FROM_BUILD: ${{ steps.artifacts.outputs.version }}
        BUILT_SHA: ${{ steps.artifacts.outputs.sha }}
        FALLBACK: ${{ steps.fallback.outputs.semVer }}
        CURRENT_SHA: ${{ github.sha }}
      run: >
        & '${{ github.action_path }}/Resolve-DraftVersion.ps1'
        -Requested $env:REQUESTED
        -Found ($env:FOUND -eq 'true')
        -FromBuild $env:FROM_BUILD
        -BuiltSha $env:BUILT_SHA
        -Fallback $env:FALLBACK
        -CurrentSha $env:CURRENT_SHA

    #─────────────────────────────────────────────────────────────────────────
    # Write the notes
    #─────────────────────────────────────────────────────────────────────────

    - name: Generate the changelog
      uses: TaffarelJr/.actions/changelog/build@v1
      with:
        version: ${{ steps.resolve.outputs.version }}
        output-path: Changelog.md
        to-ref: ${{ steps.resolve.outputs.sha }}

    # ── Have a model write the opening paragraph ──────────────────────────
    #
    # Always attempted, never required.
    # A missing copilot-requests: write permission on the caller,
    # a service outage, or a network error all land in the same place:
    # the placeholder comment stays, the release still gets drafted,
    # and you can either write the paragraph yourself
    # or delete the draft and re-run once the service is back.

    - name: Build the summary prompt
      shell: pwsh
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
      run: >
        & '${{ github.action_path }}/New-SummaryPrompt.ps1'
        -Version $env:VERSION
        -ChangelogPath Changelog.md
        -OutputPath prompt.txt

    # Not pre-installed on GitHub-hosted runners,
    # and the action shells out to it,
    # so without this the summary step fails every time.
    - name: Install the Copilot CLI
      shell: pwsh
      continue-on-error: true
      run: npm install -g @github/copilot@1.0.83

    # GH_TOKEN is NOT set here on purpose.
    # An env var on this step would only reach ai-inference's own process,
    # not the Copilot CLI subprocess it shells out to,
    # and testing that live confirmed it:
    # the token has to come from the calling workflow,
    # which is the only level an env var actually cascades down
    # through every nested composite action from.
    # An empty model lets the Copilot CLI
    # auto-select one available on the account's own plan,
    # rather than pinning a name that can quietly stop being available
    # (confirmed live: gpt-4.1, this step's previous pin,
    # started failing with "not available" with no code change on our side).
    - name: Summarize the changelog
      id: summary
      continue-on-error: true
      uses: actions/ai-inference@v3
      with:
        prompt-file: prompt.txt
        model: ''

    - name: Rewrite the notes with the summary
      if: steps.summary.outcome == 'success' && steps.summary.outputs.response-file != ''
      uses: TaffarelJr/.actions/changelog/build@v1
      with:
        version: ${{ steps.resolve.outputs.version }}
        output-path: Changelog.md
        to-ref: ${{ steps.resolve.outputs.sha }}
        summary-path: ${{ steps.summary.outputs.response-file }}

    #─────────────────────────────────────────────────────────────────────────
    # Draft it
    #─────────────────────────────────────────────────────────────────────────

    - name: Create the draft release
      id: create
      shell: pwsh
      env:
        TAG: v${{ steps.resolve.outputs.version }}
        SHA: ${{ steps.resolve.outputs.sha }}
        ARTIFACT_PATH: ${{ steps.artifacts.outputs.path }}
        TOKEN: ${{ github.token }}
      run: >
        & '${{ github.action_path }}/New-DraftRelease.ps1'
        -Tag $env:TAG
        -Sha $env:SHA
        -NotesPath Changelog.md
        -ArtifactPath $env:ARTIFACT_PATH
        -Token $env:TOKEN
