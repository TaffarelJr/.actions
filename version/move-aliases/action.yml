# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

# Repoints vMAJOR and vMAJOR.MINOR at the newest real release in scope,
# so a consumer pinning @v1 gets each new v1.x.y automatically.
# A repo's ruleset should exclude these aliases from
# whatever protects real release tags -
# unlike a vX.Y.Z tag, they are meant to move.
#
# Works out which two aliases a release tag moves and reads every real tag once,
# then hands both off to version/move-alias.

name: Move Version Aliases
description: Repoints the major and major.minor alias tags at a release tag.

inputs:
  tag:
    description: >-
      Release tag to move the aliases to, e.g. v1.4.2.
      Defaults to the tag of the release that triggered the workflow.
    required: false
    default: ''
  token:
    description: Token used to read and move the tags.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Work out which aliases move
      id: compute
      shell: pwsh
      env:
        TAG: ${{ inputs.tag }}
        EVENT_TAG: ${{ github.event.release.tag_name }}
        TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ github.repository }}
      run: >
        & '${{ github.action_path }}/Resolve-AliasPlan.ps1'
        -Tag $env:TAG
        -EventTag $env:EVENT_TAG
        -Repository $env:REPOSITORY
        -Token $env:TOKEN

    - name: Move major alias
      uses: TaffarelJr/.actions/version/move-alias@v1
      with:
        alias: ${{ steps.compute.outputs.alias-major }}
        tags: ${{ steps.compute.outputs.tags }}
        token: ${{ inputs.token }}

    - name: Move major.minor alias
      uses: TaffarelJr/.actions/version/move-alias@v1
      with:
        alias: ${{ steps.compute.outputs.alias-minor }}
        tags: ${{ steps.compute.outputs.tags }}
        token: ${{ inputs.token }}
