      - name: Assert version produced a SemVer
        shell: bash
        env:
          SEMVER: ${{ steps.version.outputs.semVer }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [[ ! "${SEMVER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::semVer was '${SEMVER}', which is not a version."
            exit 1
          fi
          if [[ "${TAG}" != "v${SEMVER}" ]]; then
            echo "::error::tag was '${TAG}', expected 'v${SEMVER}'."
            exit 1
          fi
          echo "version -> ${SEMVER} / ${TAG}"

      - name: changelog
        uses: ./changelog
        with:
          version: ${{ steps.version.outputs.semVer }}
          output-path: Changelog.md

      - name: Assert the changelog has both documents
        shell: bash
        run: |
          test -s Changelog.md \
            || { echo "::error::Changelog.md is empty."; exit 1; }
          grep -q '<details>' Changelog.md \
            || { echo "::error::No folded changelog section."; exit 1; }
          grep -q '<!--' Changelog.md \
            || { echo "::error::No summary placeholder."; exit 1; }
          echo "changelog -> $(wc -l < Changelog.md) lines"

      # No CI run has published a 'packages' artifact for this repo, so the
      # expected answer is a clean "found nothing" rather than a failure -
      # which is the behaviour a release workflow depends on.
      - name: release-artifacts
        id: artifacts
        uses: ./release-artifacts

      - name: Assert release-artifacts reported rather than failed
        shell: bash
        env:
          FOUND: ${{ steps.artifacts.outputs.found }}
          VERSION: ${{ steps.artifacts.outputs.version }}
        run: |
          if [[ "${FOUND}" != "true" && "${FOUND}" != "false" ]]; then
            echo "::error::found was '${FOUND}', expected true or false."
            exit 1
          fi
          echo "release-artifacts -> found=${FOUND} version='${VERSION}'"

