# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Exercises the actions in this repo from the working tree.
#
# Every other repo pins '@v1', and so does this repo's own release workflow -
# which means a change here would otherwise not be run by anything until after
# it was released. So these steps deliberately use './' paths instead: they
# resolve against the checkout, so a pull request tests what it actually
# changed rather than what was last published.
#
# template/sync is not exercised here. It pushes a branch and opens a pull
# request, so a self-test would either be destructive or need so much mocking
# that it would stop testing the real thing.

name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions:
    name: Exercise the actions
    runs-on: ubuntu-latest

    permissions:
      contents: read # Needed to check out the repo
      actions: read # Needed by release/fetch-artifacts to look for CI runs

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # version/calculate and changelog/build both need the history and tags

      - name: version/calculate
        id: version
        uses: ./version/calculate

      - name: Assert version/calculate produced a SemVer
        shell: bash
        env:
          SEMVER: ${{ steps.version.outputs.semVer }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [[ ! "${SEMVER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::semVer was '${SEMVER}', which is not a version."
            exit 1
          fi
          if [[ "${TAG}" != "v${SEMVER}" ]]; then
            echo "::error::tag was '${TAG}', expected 'v${SEMVER}'."
            exit 1
          fi
          echo "version/calculate -> ${SEMVER} / ${TAG}"

      - name: changelog/build
        uses: ./changelog/build
        with:
          version: ${{ steps.version.outputs.semVer }}
          output-path: Changelog.md

      - name: Assert changelog/build produced both documents
        shell: bash
        run: |
          test -s Changelog.md \
            || { echo "::error::Changelog.md is empty."; exit 1; }
          grep -q '<details>' Changelog.md \
            || { echo "::error::No folded changelog section."; exit 1; }
          grep -q '<!--' Changelog.md \
            || { echo "::error::No summary placeholder."; exit 1; }
          echo "changelog/build -> $(wc -l < Changelog.md) lines"

      # No CI run has published a 'packages' artifact for this repo, so the
      # expected answer is a clean "found nothing" rather than a failure -
      # which is the behaviour a release workflow depends on.
      - name: release/fetch-artifacts
        id: artifacts
        uses: ./release/fetch-artifacts

      - name: Assert release/fetch-artifacts reported rather than failed
        shell: bash
        env:
          FOUND: ${{ steps.artifacts.outputs.found }}
          VERSION: ${{ steps.artifacts.outputs.version }}
        run: |
          if [[ "${FOUND}" != "true" && "${FOUND}" != "false" ]]; then
            echo "::error::found was '${FOUND}', expected true or false."
            exit 1
          fi
          echo "release/fetch-artifacts -> found=${FOUND} version='${VERSION}'"

      # Nor has any run built a version called 0.0.0-none, so asking for one
      # by name should come back empty-handed the same way.
      - name: release/fetch-artifacts (by version)
        id: by-version
        uses: ./release/fetch-artifacts
        with:
          version: v0.0.0-none
          search-depth: 3

      - name: Assert the version lookup reported rather than failed
        shell: bash
        env:
          FOUND: ${{ steps.by-version.outputs.found }}
        run: |
          if [[ "${FOUND}" != "false" ]]; then
            echo "::error::found was '${FOUND}', expected false."
            exit 1
          fi
          echo "release/fetch-artifacts (by version) -> found=${FOUND}"

      # This repo carries the inherited codecov.yml, so the validator should
      # accept it. A failure here is either a real typo in that file or a
      # regression in the action.
      - name: codecov/validate
        id: codecov
        uses: ./codecov/validate

      - name: Assert codecov/validate accepted the inherited config
        shell: bash
        env:
          VALID: ${{ steps.codecov.outputs.valid }}
        run: |
          if [[ "${VALID}" != "true" ]]; then
            echo "::error::valid was '${VALID}', expected true."
            exit 1
          fi
          echo "codecov/validate -> valid=${VALID}"

      - name: Summarize
        if: always()
        shell: bash
        env:
          SEMVER: ${{ steps.version.outputs.semVer }}
        run: |
          {
            echo "### Actions exercised"
            echo
            echo "- \`version/calculate\` → \`${SEMVER}\`"
            echo "- \`changelog/build\` → $(wc -l < Changelog.md 2>/dev/null || echo 0) lines"
            echo "- \`release/fetch-artifacts\` → found=${{ steps.artifacts.outputs.found }}"
            echo "- \`release/fetch-artifacts\` (by version) → found=${{ steps.by-version.outputs.found }}"
            echo "- \`codecov/validate\` → valid=${{ steps.codecov.outputs.valid }}"
          } >> "$GITHUB_STEP_SUMMARY"

  scripts:
    name: Test the scripts on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    permissions:
      contents: read # Needed to check out the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1 # The tests build their own git history where they need one

      - name: Install the PowerShell modules
        uses: ./powershell/restore

      - name: Run the tests
        uses: ./powershell/test

      - name: Upload the coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: test/coverage
