# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Exercises the actions in this repo from the working tree.
#
# Every other repo pins '@v1', and so does this repo's own release workflow -
# which means a change here would otherwise not be run by anything until after
# it was released. So these steps deliberately use './' paths instead: they
# resolve against the checkout, so a pull request tests what it actually
# changed rather than what was last published.
#
# template-sync is not exercised here. It pushes a branch and opens a pull
# request, so a self-test would either be destructive or need so much mocking
# that it would stop testing the real thing.

name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-references:
    name: Assert self-referenced actions exist
    runs-on: ubuntu-latest

    permissions:
      contents: read # Needed to check out the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1 # Only the working tree is needed

      # v1 once pointed at a commit where a workflow or a doc example still
      # named a folder that a rename had already moved away from - silent
      # until something actually tried to resolve it. Every folder named by
      # a self-reference anywhere in this repo (a workflow, an action calling
      # another, a README example) has to exist, so that mismatch can never
      # land unnoticed again.
      - name: Assert every self-referenced action exists
        shell: bash
        run: |
          names=$(grep -rhoE 'TaffarelJr/\.actions/[A-Za-z0-9_-]+@v[0-9]+' \
              --include='*.yml' --include='*.yaml' --include='*.md' \
              --exclude-dir=.git . \
            | sed -E 's#.*/([A-Za-z0-9_-]+)@v[0-9]+#\1#' \
            | sort -u)

          missing=0
          for name in ${names}; do
            if [[ ! -f "${name}/action.yml" ]]; then
              echo "::error::References TaffarelJr/.actions/${name}@v1, but ${name}/action.yml does not exist."
              missing=1
            fi
          done

          if [[ "${missing}" == "1" ]]; then
            exit 1
          fi
          echo "Every self-referenced action exists: ${names}"

  actions:
    name: Exercise the actions
    runs-on: ubuntu-latest

    permissions:
      contents: read # Needed to check out the repo
      actions: read # Needed by fetch-release-artifacts to look for CI runs

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # calculate-version and build-changelog both need the history and tags

      - name: calculate-version
        id: version
        uses: ./calculate-version

      - name: Assert calculate-version produced a SemVer
        shell: bash
        env:
          SEMVER: ${{ steps.version.outputs.semVer }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [[ ! "${SEMVER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::semVer was '${SEMVER}', which is not a version."
            exit 1
          fi
          if [[ "${TAG}" != "v${SEMVER}" ]]; then
            echo "::error::tag was '${TAG}', expected 'v${SEMVER}'."
            exit 1
          fi
          echo "calculate-version -> ${SEMVER} / ${TAG}"

      - name: build-changelog
        uses: ./build-changelog
        with:
          version: ${{ steps.version.outputs.semVer }}
          output-path: Changelog.md

      - name: Assert build-changelog produced both documents
        shell: bash
        run: |
          test -s Changelog.md \
            || { echo "::error::Changelog.md is empty."; exit 1; }
          grep -q '<details>' Changelog.md \
            || { echo "::error::No folded changelog section."; exit 1; }
          grep -q '<!--' Changelog.md \
            || { echo "::error::No summary placeholder."; exit 1; }
          echo "build-changelog -> $(wc -l < Changelog.md) lines"

      # No CI run has published a 'packages' artifact for this repo, so the
      # expected answer is a clean "found nothing" rather than a failure -
      # which is the behaviour a release workflow depends on.
      - name: fetch-release-artifacts
        id: artifacts
        uses: ./fetch-release-artifacts

      - name: Assert fetch-release-artifacts reported rather than failed
        shell: bash
        env:
          FOUND: ${{ steps.artifacts.outputs.found }}
          VERSION: ${{ steps.artifacts.outputs.version }}
        run: |
          if [[ "${FOUND}" != "true" && "${FOUND}" != "false" ]]; then
            echo "::error::found was '${FOUND}', expected true or false."
            exit 1
          fi
          echo "fetch-release-artifacts -> found=${FOUND} version='${VERSION}'"

      # Nor has any run built a version called 0.0.0-none, so asking for one
      # by name should come back empty-handed the same way.
      - name: fetch-release-artifacts (by version)
        id: by-version
        uses: ./fetch-release-artifacts
        with:
          version: v0.0.0-none
          search-depth: 3

      - name: Assert the version lookup reported rather than failed
        shell: bash
        env:
          FOUND: ${{ steps.by-version.outputs.found }}
        run: |
          if [[ "${FOUND}" != "false" ]]; then
            echo "::error::found was '${FOUND}', expected false."
            exit 1
          fi
          echo "fetch-release-artifacts (by version) -> found=${FOUND}"

      # This repo carries the inherited codecov.yml, so the validator should
      # accept it. A failure here is either a real typo in that file or a
      # regression in the action.
      - name: validate-codecov
        id: codecov
        uses: ./validate-codecov

      - name: Assert validate-codecov accepted the inherited config
        shell: bash
        env:
          VALID: ${{ steps.codecov.outputs.valid }}
        run: |
          if [[ "${VALID}" != "true" ]]; then
            echo "::error::valid was '${VALID}', expected true."
            exit 1
          fi
          echo "validate-codecov -> valid=${VALID}"

      - name: Summarize
        if: always()
        shell: bash
        env:
          SEMVER: ${{ steps.version.outputs.semVer }}
        run: |
          {
            echo "### Actions exercised"
            echo
            echo "- \`calculate-version\` → \`${SEMVER}\`"
            echo "- \`build-changelog\` → $(wc -l < Changelog.md 2>/dev/null || echo 0) lines"
            echo "- \`fetch-release-artifacts\` → found=${{ steps.artifacts.outputs.found }}"
            echo "- \`fetch-release-artifacts\` (by version) → found=${{ steps.by-version.outputs.found }}"
            echo "- \`validate-codecov\` → valid=${{ steps.codecov.outputs.valid }}"
          } >> "$GITHUB_STEP_SUMMARY"
