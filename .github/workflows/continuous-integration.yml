# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Runs this repo's own PowerShell test suite and reports coverage.
#
# Exercising the actions themselves is a separate workflow
# (exercise-actions.yml) - dogfooding local actions from the working tree
# and testing the scripts that back them are different concerns.

name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Test the scripts on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    permissions:
      contents: read # Needed to check out the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1 # The tests build their own git history where they need one

      - name: Install the PowerShell modules
        uses: ./powershell/restore

      - name: Run the tests
        uses: ./powershell/test

      - name: Upload the coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: test/coverage

      # Coverage is identical between OSes (same tests, same source), so only
      # one leg sends it to Codecov.
      - name: codecov/upload
        if: matrix.os == 'ubuntu-latest'
        uses: ./codecov/upload
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
