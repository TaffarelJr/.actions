# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

# Packs a repo's .NET solution,
# stamping in the version when one is given.
#
# The caller must have run dotnet/setup and dotnet/build first -
# this action passes --no-build.

name: Pack .NET
description: Packs a repo's .NET solution.

inputs:
  configuration:
    description: The build configuration, e.g. Release or Debug.
    required: false
    default: Release
  version:
    description: >-
      The version to stamp into the package, e.g. 1.4.0.
      Empty packs without one.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Pack the solution
      shell: pwsh
      env:
        CONFIGURATION: ${{ inputs.configuration }}
        VERSION: ${{ inputs.version }}
      run: >
        & '${{ github.action_path }}/Invoke-Pack.ps1'
        -Configuration $env:CONFIGURATION
        -Version $env:VERSION
