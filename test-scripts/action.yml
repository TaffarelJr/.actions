# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

# Runs every *.Tests.ps1 in the repo, each in its own PowerShell process.

name: Test Scripts
description: Discovers and runs every *.Tests.ps1 in the repo, each in its own process.

inputs:
  path:
    description: Folder to search, recursively. Defaults to the repo root.
    required: false
    default: "."
  show-output:
    description: Print every file's own output, not only a failing file's.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Run the tests
      shell: pwsh
      env:
        TEST_PATH: ${{ inputs.path }}
        SHOW_OUTPUT: ${{ inputs.show-output }}
      run: |
        $show = $env:SHOW_OUTPUT -eq 'true'
        & '${{ github.action_path }}/Run-Tests.ps1' `
          -Path $env:TEST_PATH `
          -ShowOutput:$show
