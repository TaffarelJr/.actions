# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

# Brings a parent template's changes down into this repo as a pull request.
#
# Every repo's sync steps are identical;
# only the parent URL, the schedule and the strategy differ.
# Keeping the steps here means a repo's own workflow
# is just those three values plus its triggers,
# and a fix to the mechanism does not have to walk the whole template chain.
#
# The caller must have checked out with fetch-depth: 0,
# using a token that can push and open pull requests.
# Pull requests opened with the default GITHUB_TOKEN cannot trigger workflows,
# so a required status check would never report
# and the PR could never be merged.

name: Template Sync
description: Opens a pull request bringing the parent template's changes down.

inputs:
  template-url:
    description: Clone URL of the parent template.
    required: true
  strategy:
    description: >-
      rebase for a template layer, replaying the parent's commits
      so history stays linear and no merge commit of ours can reach a leaf.
      merge for a leaf, which is the end of the chain
      and so the only place a merge commit belongs.
    required: true
  template-branch:
    description: Branch to sync from in the parent.
    required: false
    default: main
  base-branch:
    description: Branch being synced into.
    required: false
    default: main
  sync-branch:
    description: Branch the pull request is opened from.
    required: false
    default: template-sync
  remote-name:
    description: Name given to the parent's git remote.
    required: false
    default: template
  token:
    description: Token used to push the branch and open the pull request.
    required: false
    default: ${{ github.token }}
  git-user-name:
    description: Author name for the sync commits.
    required: false
    default: github-actions
  git-user-email:
    description: Author email for the sync commits.
    required: false
    default: github-actions@github.com

outputs:
  synced:
    description: Whether a branch was built and a pull request opened or updated.
    value: ${{ steps.plan.outputs.proceed }}
  conflict:
    description: Whether the result contains conflict markers needing resolution.
    value: ${{ steps.build.outputs.conflict }}
  deleted:
    description: >-
      Paths kept out of this repo rather than landing from the sync:
      ones the parent edited that this repo had already deleted,
      and a scripts/ the parent added where this repo - a leaf -
      carries none of its own.
    value: ${{ steps.build.outputs.deleted }}
  kept-ours:
    description: >-
      Paths where this repo's own version always wins over the parent's,
      because the answer never changes between syncs.
    value: ${{ steps.build.outputs.kept-ours }}
  missing:
    description: How many patches the parent held that this repo did not.
    value: ${{ steps.plan.outputs.missing }}

runs:
  using: composite
  steps:
    # A base template has no parent,
    # so its caller leaves template-url empty rather than omitting it -
    # GitHub Actions only rejects a wholly missing input, not an empty one.
    # Skip cleanly rather than let an empty URL reach `git remote add`
    # and fail ungracefully in the next step.
    - name: Verify configuration
      id: verify
      shell: pwsh
      env:
        TEMPLATE_URL: ${{ inputs.template-url }}
        STRATEGY: ${{ inputs.strategy }}
        REPOSITORY: ${{ github.repository }}
      run: >
        & '${{ github.action_path }}/Test-TemplateConfig.ps1'
        -TemplateUrl $env:TEMPLATE_URL
        -Strategy $env:STRATEGY
        -Repository $env:REPOSITORY

    - name: Configure Git
      if: steps.verify.outputs.configured == 'true'
      shell: pwsh
      env:
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        git config user.name $env:GIT_USER_NAME
        git config user.email $env:GIT_USER_EMAIL

    - name: Fetch the parent template
      if: steps.verify.outputs.configured == 'true'
      shell: pwsh
      env:
        REMOTE: ${{ inputs.remote-name }}
        TEMPLATE_URL: ${{ inputs.template-url }}
        TEMPLATE_BRANCH: ${{ inputs.template-branch }}
      run: |
        git remote remove $env:REMOTE 2>$null
        git remote add $env:REMOTE $env:TEMPLATE_URL
        git fetch --prune $env:REMOTE $env:TEMPLATE_BRANCH

    - name: Decide what needs doing
      id: plan
      if: steps.verify.outputs.configured == 'true'
      shell: pwsh
      env:
        REMOTE: ${{ inputs.remote-name }}
        TEMPLATE_BRANCH: ${{ inputs.template-branch }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        SYNC_BRANCH: ${{ inputs.sync-branch }}
        STRATEGY: ${{ inputs.strategy }}
      run: >
        & '${{ github.action_path }}/Resolve-SyncPlan.ps1'
        -Remote $env:REMOTE
        -TemplateBranch $env:TEMPLATE_BRANCH
        -BaseBranch $env:BASE_BRANCH
        -SyncBranch $env:SYNC_BRANCH
        -Strategy $env:STRATEGY

    - name: Build the sync branch
      id: build
      if: steps.plan.outputs.proceed == 'true'
      shell: pwsh
      env:
        REMOTE: ${{ inputs.remote-name }}
        TEMPLATE_BRANCH: ${{ inputs.template-branch }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        SYNC_BRANCH: ${{ inputs.sync-branch }}
        STRATEGY: ${{ inputs.strategy }}
      run: >
        & '${{ github.action_path }}/New-SyncBranch.ps1'
        -Remote $env:REMOTE
        -TemplateBranch $env:TEMPLATE_BRANCH
        -BaseBranch $env:BASE_BRANCH
        -SyncBranch $env:SYNC_BRANCH
        -Strategy $env:STRATEGY

    - name: Push the sync branch
      if: steps.plan.outputs.proceed == 'true'
      shell: pwsh
      env:
        SYNC_BRANCH: ${{ inputs.sync-branch }}
      run: git push --force origin $env:SYNC_BRANCH

    - name: Create or update the pull request
      if: steps.plan.outputs.proceed == 'true'
      shell: pwsh
      env:
        REPOSITORY: ${{ github.repository }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        SYNC_BRANCH: ${{ inputs.sync-branch }}
        TEMPLATE_URL: ${{ inputs.template-url }}
        STRATEGY: ${{ inputs.strategy }}
        CONFLICT: ${{ steps.build.outputs.conflict }}
        DELETED: ${{ steps.build.outputs.deleted }}
        KEPT_OURS: ${{ steps.build.outputs.kept-ours }}
        MISSING: ${{ steps.plan.outputs.missing }}
        TOKEN: ${{ inputs.token }}
      run: >
        & '${{ github.action_path }}/Set-SyncPullRequest.ps1'
        -Repository $env:REPOSITORY
        -BaseBranch $env:BASE_BRANCH
        -SyncBranch $env:SYNC_BRANCH
        -TemplateUrl $env:TEMPLATE_URL
        -Strategy $env:STRATEGY
        -Conflict ($env:CONFLICT -eq 'true')
        -Deleted $env:DELETED
        -KeptOurs $env:KEPT_OURS
        -Missing $env:MISSING
        -Token $env:TOKEN
